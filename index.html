    <script>
        // Prevent stretch, rubber-band, and elastic overscroll immediately
        document.addEventListener('touchmove', function(e) {
            if (e.cancelable) e.preventDefault();
        }, { passive: false });
        document.addEventListener('gesturestart', function(e) {
            if (e.cancelable) e.preventDefault();
        }, { passive: false });
    </script>
    <link href="/loader.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="/icon.png">
</head>
<body style="background: #efcc19; margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; position: fixed; overscroll-behavior: none; -webkit-overscroll-behavior: none; touch-action: none;">
    <div id="root">
        <div class="load">
            <div class="loader">Loading...</div>
        </div>
    </div>
    <script type="module" src="/src/index.jsx"></script>
</body>
